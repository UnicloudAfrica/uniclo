<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ConveyThis public translation key (non-secret, safe for client).
         GAP-035: migrated from a hardcoded literal to `VITE_CONVEYTHIS_KEY`
         so each environment (prod, staging, dev) can bind its own account
         without a source-code edit. The script short-circuits when the
         env var is unset — e.g. in local dev where translation is off. -->
    <!-- No SRI/crossorigin: the initializer is a third-party rolling asset
         (hash changes on their releases) and their CDN sends no CORS headers,
         so `integrity` + `crossorigin` made the browser block the load. -->
    <script src="https://cdn.conveythis.com/javascript/conveythis-initializer.js"></script>
    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function () {
            // Vite substitutes the `%VITE_CONVEYTHIS_KEY%` token below at build
            // time. When the env var is unset it leaves the token verbatim, so
            // we skip init if the value is empty OR still the raw placeholder.
            // The sentinel is assembled at runtime ("%VITE" + "...") so Vite
            // does NOT substitute it too — otherwise, when the key IS set, both
            // occurrences would become the key and the guard would always match,
            // silently disabling ConveyThis. See GAP-035.
            var conveyKey = "%VITE_CONVEYTHIS_KEY%";
            var unresolvedPlaceholder = "%VITE" + "_CONVEYTHIS_KEY%";
            if (!conveyKey || conveyKey === unresolvedPlaceholder) {
                return;
            }
            if (typeof globalThis.window.ConveyThis_Initializer === "object" && globalThis.window.ConveyThis_Initializer?.init) {
                globalThis.window.ConveyThis_Initializer.init({
                    api_key: conveyKey,
                });
            } else {
                console.warn("ConveyThis initializer script failed to load.");
            }
        });
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="One Cloud One Africa" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- Google Fonts - Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <title>UniCloud-Africa</title>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="//code.tidio.co/trbn6ytlyhltbigw66s6ysarej0k5vdy.js" async></script>
</body>

</html>
